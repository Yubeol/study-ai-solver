[project]
name = "adsp-study-rag"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "numpy>=2.3.5",
    "opencv-contrib-python>=4.10.0.84",
    "paddleocr==3.7.0",
    "paddlepaddle==3.3.1",
    "pillow>=12.3.0",
    "psycopg[binary,pool]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pypdfium2==5.13.0",
    "python-multipart>=0.0.32",
    "sentence-transformers==6.1.0",
    # sentence-transformers가 쓰는 torch를 직접 고정해 CPU 인덱스에서 받는다(D-M-031)
    "torch==2.14.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]
# 실제 모델 테스트는 느리므로 기본 실행에서 제외: `uv run pytest -m ocr_model`, `-m embedding_model`, `-m reranker_model`
addopts = "-m 'not ocr_model and not embedding_model and not reranker_model'"
markers = [
    "ocr_model: 실제 PaddleOCR 모델을 로드하는 느린 테스트",
    "embedding_model: 실제 임베딩 모델(BGE-M3)을 로드하는 느린 테스트",
    "reranker_model: 실제 리랭커 모델을 로드하는 느린 테스트",
]
