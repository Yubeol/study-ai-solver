# PR마다 백엔드 테스트와 프론트 lint·build를 돌린다(D-M-030).
# - 실제 모델 테스트는 pyproject의 addopts로 제외된다(가짜 모델만 사용, 모델 다운로드 없음).
# - DB 정보는 Secrets에 넣지 않는다. 닿지 않는 가짜 DB 값이라 DB 테스트는 건너뛴다 → DB 관련 변경은 PR 전에 로컬에서 확인.
# - torch는 PyTorch CPU 인덱스의 CPU 빌드가 설치된다(nvidia-*·triton 없음, D-M-031).
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: "1"
      DB_NAME: ci
      DB_USER: ci
      DB_PASSWORD: ci
      DB_SCHEMA: mingyu
      DB_APP_SCHEMA: mingyu_app
      JUDGE_PROVIDER: none
      PRELOAD_MODELS: "false"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v8.1.0
        with:
          python-version: "3.12"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run pytest -rs

  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
